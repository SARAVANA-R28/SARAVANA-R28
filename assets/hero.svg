<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
    <stop offset="0%" stop-color="#050816"/>
    <stop offset="50%" stop-color="#0B1B3A"/>
    <stop offset="100%" stop-color="#020617"/>
  </linearGradient>

  <linearGradient id="text" x1="250" y1="100" x2="950" y2="200">
    <stop offset="0%" stop-color="#00F5FF"/>
    <stop offset="50%" stop-color="#7C3AED"/>
    <stop offset="100%" stop-color="#00F5FF"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
  </radialGradient>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="textGlow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<!-- Background -->

<rect width="1200" height="300" rx="25" fill="url(#bg)"/>

<!-- Ambient glow -->

<circle cx="180" cy="80" r="150" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx"
           values="180;300;180"
           dur="8s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1020" cy="220" r="180" fill="url(#glow)" filter="url(#blur)">
  <animate attributeName="cx"
           values="1020;900;1020"
           dur="10s"
           repeatCount="indefinite"/>
</circle>

<!-- Animated grid -->

<g opacity="0.15" stroke="#00F5FF">

  <path d="M0 50H1200">
    <animate attributeName="d"
             values="M0 50H1200;M0 70H1200;M0 50H1200"
             dur="6s"
             repeatCount="indefinite"/>
  </path>

  <path d="M0 100H1200"/>
  <path d="M0 150H1200"/>
  <path d="M0 200H1200"/>
  <path d="M0 250H1200"/>

  <path d="M100 0V300"/>
  <path d="M200 0V300"/>
  <path d="M300 0V300"/>
  <path d="M400 0V300"/>
  <path d="M500 0V300"/>
  <path d="M600 0V300"/>
  <path d="M700 0V300"/>
  <path d="M800 0V300"/>
  <path d="M900 0V300"/>
  <path d="M1000 0V300"/>
  <path d="M1100 0V300"/>

</g>

<!-- Floating particles -->

<g fill="#00F5FF">

<circle cx="120" cy="90" r="2">
  <animate attributeName="cy"
           values="90;60;90"
           dur="4s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1080" cy="70" r="2">
  <animate attributeName="cy"
           values="70;110;70"
           dur="5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="950" cy="250" r="2">
  <animate attributeName="cy"
           values="250;220;250"
           dur="4.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="250" cy="240" r="2">
  <animate attributeName="cy"
           values="240;210;240"
           dur="5.5s"
           repeatCount="indefinite"/>
</circle>

</g>

<!-- Top label -->

<text x="600"
   y="72"
   text-anchor="middle"
   fill="#94A3B8"
   font-family="monospace"
   font-size="15"
   letter-spacing="5">

```
  &lt; DEVELOPER PROFILE /&gt;
```

</text>

<!-- Name glow -->

<text x="600"
   y="145"
   text-anchor="middle"
   fill="url(#text)"
   font-family="Arial, Helvetica, sans-serif"
   font-size="60"
   font-weight="bold"
   letter-spacing="10"
   filter="url(#textGlow)">

```
  SARAVANA
```

</text>

<!-- Subtitle -->

<text x="600"
   y="185"
   text-anchor="middle"
   fill="#CBD5E1"
   font-family="monospace"
   font-size="18">

```
  AI ENGINEER • FULL STACK DEVELOPER • SOFTWARE DEVELOPER
```

</text>

<!-- Animated cursor -->

<rect x="915"
   y="170"
   width="3"
   height="20"
   fill="#00F5FF">

<animate attributeName="opacity"
        values="1;0;1"
        dur="0.9s"
        repeatCount="indefinite"/>

</rect>

<!-- Bottom line -->

<line x1="350"
   y1="225"
   x2="850"
   y2="225"
   stroke="#00F5FF"
   stroke-opacity="0.35">

<animate attributeName="x1"
        values="350;420;350"
        dur="5s"
        repeatCount="indefinite"/>

<animate attributeName="x2"
        values="850;780;850"
        dur="5s"
        repeatCount="indefinite"/>

</line>

<!-- Status -->

<circle cx="470"
     cy="260"
     r="5"
     fill="#22C55E">

<animate attributeName="opacity"
        values="1;0.3;1"
        dur="1.5s"
        repeatCount="indefinite"/>

</circle>

<text x="485"
   y="266"
   fill="#94A3B8"
   font-family="monospace"
   font-size="14">

```
  ONLINE • BUILDING SOMETHING AWESOME
```

</text>

</svg>
